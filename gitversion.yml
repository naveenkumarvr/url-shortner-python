mode: ContinuousDeployment
tag-prefix: 'v' 
ignore:
  sha: []
branches:
  main:
    regex: ^main$
    increment: Patch
    is-main-branch: true
    label: ''
  uat:
    mode: ContinuousDeployment
    regex: ^uat$
    increment: Patch
    label: alpha
    track-merge-target: true

