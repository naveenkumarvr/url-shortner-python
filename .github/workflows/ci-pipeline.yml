    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.1.0
      with:
        versionSpec: '6.3.x'
    
    - name: Determine Version
      id: version_step # step id used as a reference for output values
      uses: gittools/actions/gitversion/execute@v4.1.0
      env:
        DOTNET_HOST_PATH: /usr/bin/dotnet
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        DOTNET_NOLOGO: true
        GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
        GIT_VERSION_DISABLE_REPOOWNER_CHECK: true
    
    - name: Print GitVersion outputs
      run: |
        echo "FullSemVer: ${{ steps.version_step.outputs.FullSemVer }}"
        echo "NuGetVersion: ${{ steps.version_step.outputs.NuGetVersion }}"
        echo "InformationalVersion: ${{ steps.version_step.outputs.InformationalVersion }}"
