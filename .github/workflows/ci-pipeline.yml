name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - uat
  

jobs:
  ci-pipeline:
    name: CI Pipline
    runs-on: [self-hosted, Linux, X64, nk-wsl]
    steps:
    
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      shell: bash
      run: |
        source /tmp/gh-env/bin/activate
        python3 -m pip install -r app/requirements.txt 

    - name: CodeCoverage
      shell: bash
      run: |
        source /tmp/gh-env/bin/activate
        pytest --cov=app --cov-report=xml:app/coverage.xml
    
    - name: Sonarqube Analysis
      run: |
        docker run \
        --rm \
        -e SONAR_SCANNER_OPTS="\
          -Dsonar.projectKey=url-shortner-python \
          -Dsonar.projectName=url-shortner-python \
          -Dsonar.projectVersion=1.0 \
          -Dsonar.sources=/usr/src/ \
          -Dsonar.host.url=http://host.docker.internal:9000 \
          -Dsonar.sourceEncoding=UTF-8 \
          -Dsonar.python.version=3.11 \
          -Dsonar.python.coverage.reportPaths=/usr/src/coverage.xml \
          -Dsonar.exclusions=**/migrations/**,k8-manifest/**,vnv-urlshrt/** \
          -Dsonar.coverage.exclusions=**/migrations/**,**/test_*.py \
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}" \
        -v "./app:/usr/src" \
        sonarsource/sonar-scanner-cli
    
    - name: SBOM Report Generation
      run: |
        syft scan dir:./app -o cyclonedx-json > sbom-cyclonedx.json

        #Get Project ID of D-Track
        PROJECT_ID=$(curl -s -X GET "http://localhost:8090/api/v1/project?name=${GITHUB_REPOSITORY##*/}" -H "X-Api-Key: ${{ secrets.DTRACK_API_KEY }}" | jq '.[0].uuid')

        # Upload SBOM Report to DTRACK
        curl -X POST "http://localhost:8090/api/v1/bom" -H "X-Api-Key: ${{ secrets.DTRACK_API_KEY }}" -H "Content-Type: multipart/form-data" -F "project=$PROJECT_ID" -F "bom=@sbom-cyclonedx.json"