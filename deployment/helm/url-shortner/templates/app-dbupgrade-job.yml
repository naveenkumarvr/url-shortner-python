apiVersion: batch/v1
kind: Job
metadata:
  creationTimestamp: null
  labels: 
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.app.component }}
  name: "{{ include "app.fullname" . }}-app-dbupgrade-job"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            MYSQL_HOST={{ include "app.fullname" . }}-mysqlsvc
            echo "Waiting for MySQL..."
            while ! nc -vz $MYSQL_HOST 3306 >/dev/null 2>&1; do
              echo "MySQL not ready, sleeping 5s..."
              sleep 5
            done
            echo "MySQL is ready!"
      containers:
      - image: "{{ .Values.app.deploy.image }}:{{ .Values.app.deploy.tag }}"
        name: "{{ include "app.fullname" . }}-app-dbupgrade-job"
        ports:
          - containerPort: {{ .Values.app.deploy.containerPort }}
        env:
          - name: REDIS_HOST
            value: {{ include "app.fullname" . }}-redissvc
          - name: MYSQL_HOST
            value: {{ include "app.fullname" . }}-mysqlsvc
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: {{ .Values.app.deploy.otel_endpoint }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            flask db upgrade
