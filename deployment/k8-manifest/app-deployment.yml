apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: url-shortner
  name: url-shortner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: url-shortner # This is how the deployment knows which pod it is contorlling. And in Template you can see it adds the variable
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: url-shortner # This label is added to the pod by deployment to identify it by selector
    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo "Waiting for MySQL..."
            while ! nc -vz mysql 3306 >/dev/null 2>&1; do
              echo "MySQL not ready, sleeping 5s..."
              sleep 5
            done
            echo "MySQL is ready!"
      containers:
      - image: localhost:9010/url-shotner:0.1.0-otel-uat.1-116
        name: url-shortner
        ports:
          - containerPort: 5000
        env:
          - name: REDIS_HOST
            value: redis
          - name: MYSQL_HOST
            value: mysql
          # - name: OTEL_EXPORTER_OTLP_ENDPOINT
          #   value: {{ .Values.app.deploy.otel_endpoint }}
        resources: {}
status: {}
