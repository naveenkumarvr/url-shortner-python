apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotrod
  
  labels:
    app: hotrod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotrod
  template:
    metadata:
      labels:
        app: hotrod
    spec:
      containers:
        - name: hotrod
          image: jaegertracing/example-hotrod:1.72.0
          args: ["all", "--otel-exporter=otlp"]
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "hotrod-gateway"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=demo,service.version=1.0.0,env=dev"
          ports:
            - containerPort: 8080
            - containerPort: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: hotrod
  
  labels:
    app: hotrod
spec:
  selector:
    app: hotrod
  ports:
    - name: http
      port: 8080
      targetPort: 8080